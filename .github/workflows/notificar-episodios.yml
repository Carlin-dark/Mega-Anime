name: Notificar Novos Episódios no Discord

on:
  schedule:
    # Roda todo dia às 19h, 21h e 23h (Horário de Brasília / UTC-3)
    - cron: '0 22,0,2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar-e-notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar episódios e notificar Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/notificar-discord.js

      - name: Salvar memória de episódios enviados
        run: |
          git config user.name "Mega Animes Bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/enviados.json
          git diff --staged --quiet || (git commit -m "Atualiza episódios notificados no Discord" && git push)
